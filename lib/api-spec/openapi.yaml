openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Brooklyn city guide chat
  - name: dishes
    description: Brooklyn dish photo gallery
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat/system-prompt:
    get:
      operationId: getChatSystemPrompt
      tags: [chat]
      summary: Get the city guide system prompt
      responses:
        "200":
          description: The system prompt used for city guide answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemPromptResponse"
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Ask the Brooklyn city guide a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: The city guide answer and generation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: The request body is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gemini could not complete the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Gemini API key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dishes:
    get:
      operationId: listDishPhotos
      tags: [dishes]
      summary: List Brooklyn dish photos
      responses:
        "200":
          description: Dish photos, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishPhotoItem"
    post:
      operationId: createDishPhoto
      tags: [dishes]
      summary: Upload a Brooklyn dish photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishPhotoInput"
      responses:
        "201":
          description: The saved dish photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPhotoItem"
        "400":
          description: Invalid title or image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported image type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dishes/{id}/image:
    get:
      operationId: getDishPhotoImage
      tags: [dishes]
      summary: Get a dish photo image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Dish photo not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SystemPromptResponse:
      type: object
      properties:
        systemPrompt:
          type: string
      required:
        - systemPrompt
    ChatRequest:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ChatMessage"
        settings:
          $ref: "#/components/schemas/ChatSettings"
      required:
        - message
    ChatMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 2000
      required:
        - role
        - content
    ChatSettings:
      type: object
      additionalProperties: false
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        maxOutputTokens:
          type: integer
          minimum: 32
          maximum: 1024
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        usage:
          type: object
          properties:
            promptTokens:
              type: integer
            outputTokens:
              type: integer
            totalTokens:
              type: integer
            truncated:
              type: boolean
          required:
            - promptTokens
            - outputTokens
            - totalTokens
            - truncated
        settings:
          $ref: "#/components/schemas/ChatSettings"
        model:
          type: string
      required:
        - reply
        - usage
        - settings
        - model
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    DishPhotoInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        caption:
          type: string
          maxLength: 500
        image:
          type: string
          maxLength: 4194400
          pattern: '^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$'
      required:
        - title
        - image
    DishPhotoItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: string
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        createdAt:
          type: string
          format: date-time
        imageUrl:
          type: string
      required:
        - id
        - title
        - caption
        - mimeType
        - createdAt
        - imageUrl

